name: Bug report
description: Report a reproducible problem with QuickQuit.
title: "Bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Please check the [Troubleshooting](https://github.com/choudharyjayesh668/QuickQuit#troubleshooting) section of the README and the [existing issues](https://github.com/choudharyjayesh668/QuickQuit/issues?q=is%3Aissue) first.

        Do not include passwords or private files. Report security vulnerabilities privately as described in [SECURITY.md](https://github.com/choudharyjayesh668/QuickQuit/blob/main/SECURITY.md), not here.
  - type: textarea
    id: description
    attributes:
      label: Bug description
      description: A clear, short description of the problem.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: List every step, starting from a state anyone can get to.
      placeholder: |
        1. Install QuickQuit with "Install QuickQuit.command"
        2. Open ...
        3. Press Control+Shift+Q
        4. See ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
      description: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
      description: What happened instead? Include the exact text of any error message.
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version
      description: "Run `sw_vers` in Terminal, or look in Apple menu → About This Mac."
      placeholder: "For example: macOS 15.5"
    validations:
      required: true
  - type: dropdown
    id: chip
    attributes:
      label: Mac type
      options:
        - Apple silicon
        - Intel
        - Not sure
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: QuickQuit version
      description: "Run `defaults read /Applications/QuickQuit.app/Contents/Info CFBundleShortVersionString`, or give the commit hash you installed from."
      placeholder: "For example: 1.0.0 or commit abc1234"
    validations:
      required: true
  - type: input
    id: swift
    attributes:
      label: Swift version
      description: "Needed for build and installation problems. Run `swift --version`."
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Screenshots or logs
      description: Paste Terminal output from the installer or build here, or drag in screenshots. Remove any personal information first.
      render: shell
    validations:
      required: false
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: "Anything else that might help: other apps that use global shortcuts, keyboard layout, when the problem started."
    validations:
      required: false
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched the existing issues and this bug is not already reported.
          required: true
        - label: This report contains no passwords, personal data, or security vulnerability details.
          required: true
